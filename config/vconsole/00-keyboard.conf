# System XKB layout: Colemak-DH (UK base). systemd-localed exposes this as its
# X11 layout, and KWin falls back to that when there is no kxkbrc - i.e. on the
# Plasma Login Manager greeter, which otherwise comes up as QWERTZ/QWERTY.
# Must match ~/.config/kxkbrc (LayoutList/VariantList) and voxtype's eitype_xkb_*.
# Deployed as a real copy by `./install --vconsole`, not linked.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "gb"
        Option "XkbVariant" "colemak_dh"
EndSection
