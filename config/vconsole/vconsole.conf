# Console keyboard layout: Colemak-DH (ISO, UK base), the console twin of
# 00-keyboard.conf next to this file. Read by systemd-vconsole-setup and baked
# into the initramfs by the sd-vconsole hook.
# Deployed as a real copy by `./install --vconsole` (/home is not mounted yet
# when the console is set up), not linked.
KEYMAP=mod-dh-iso-uk
