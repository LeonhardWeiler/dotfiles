# Palette for the LateNight-Leo Mixxx skin.
#
# Single source of truth for the skin's colors: `build-skin` reads this file,
# nothing else carries a hardcoded value. The palette is the one the rest of
# this setup runs on - config/rofi/shared/colors.rasi for background/foreground/
# accent, config/foot/foot.ini for the muted ANSI row, config/dwl/config.h for
# the border tones.
#
# Format: `<name> <value>`, one per line. `#` starts a comment. Values are
# either #rrggbb or a plain number.

# --- Base ------------------------------------------------------------------
# bg/fg/surface come from rofi, so the skin sits in the same tonal range as the
# launcher that opens it.
bg              #141414
fg              #dddddd
surface         #2d2d2d
border          #595959
border_focus    #dddddd
dim             #999999

# --- Accent ----------------------------------------------------------------
# rofi's `accent`. Both decks share it (monochrome scheme): decks are told
# apart by position, not by hue.
accent          #768e84

# --- Signal colors (foot's ANSI row) ---------------------------------------
# Only used where a color has to carry meaning that the accent cannot: a
# warning must not look like a normal active state.
warn            #9d5b61
green           #838d69
orange          #b38d6a
blue            #606d84
cyan            #808fa0
magenta         #766577

# --- Recolor rules ---------------------------------------------------------
# Every color in the upstream skin is converted to HSL and rewritten as
# H/S from the palette, L kept as-is. Keeping L is what makes this safe:
# gradients, drop shadows and the pressed/active/hover variants of a button
# are all encoded as lightness steps, and they survive untouched.
#
# Colors at or below this saturation are already neutral - left alone.
neutral_max_s   6
# Colors above `neutral_max_s` but at or below this are upstream's *warm grey*
# surfaces (PaleMoon's moonlight tint, H~30 S~8-19%). They are not accents, so
# they are flattened to true grey rather than tinted with the accent hue.
surface_max_s   25
# Real accents (S > surface_max_s) are remapped onto this saturation band. The
# range is deliberately narrow and low: this setup is muted everywhere, and a
# 100%-saturated upstream orange must not come out as a neon green.
accent_min_s    10
accent_max_s    18
# Above this lightness an accent is dimmed further - a bright tint reads as
# much louder than a dark one at equal saturation.
bright_l        65
bright_s_factor 0.6
# Assets whose *name* marks them as an alert - the clipping segments of the VU
# meters, the record dot - are recolored with a wider saturation band than
# everything else. Muting is the right default, but an indicator that has to
# interrupt you is exactly the thing that must not blend in, and it is a role
# no hue rule can infer.
alert_pattern   clip rec
alert_min_s     30
alert_max_s     45

# --- Hue families ----------------------------------------------------------
# Which palette color each upstream hue range is pulled towards.
# Format: `hue_family <from> <to> <palette-name>`, degrees on the color wheel.
# Reds and magentas keep a warning role; everything between orange and cyan
# was decoration in upstream (buttons, play state, fader bars) and collapses
# onto the single accent.
hue_family    345  360  warn
hue_family      0   14  warn
hue_family     15   64  accent
hue_family     65  160  accent
hue_family    161  250  accent
hue_family    251  344  warn

# --- Fonts -----------------------------------------------------------------
# Same face as foot and rofi. Mixxx packs far more text into far less space
# than a terminal does, so the size is its own value, not foot's 17.
font_family     JetBrains Mono Nerd Font
font_size       11
