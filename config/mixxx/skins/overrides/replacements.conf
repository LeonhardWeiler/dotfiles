# Literal text replacements for LateNight-Leo, applied by build-skin to the
# pristine upstream templates before the recolor.
#
# The third override channel, and the narrowest one. palette.conf decides what
# a *hue* becomes, overrides/scheme-vars.conf decides what a named scheme
# variable becomes; this file is for the values upstream wrote directly into a
# template, where neither of the other two can reach.
#
# Format: `<path under the skin> ||| <text to find> ||| <text to put there>`.
# Both sides are literal - no regex, no escaping. `@name@` in the replacement
# is resolved from palette.conf, so colors are still written down exactly once.
# Whitespace around the three fields is trimmed; a replacement that matches
# nothing fails the build, so an upstream change is reported rather than
# silently dropped.
#
# Search strings are upstream's own text - `#FFFFFF`, not the `#ffffff` the
# recolor would leave behind - because this runs before the recolor.

# --- FX assign buttons -----------------------------------------------------
# The buttons are 26px wide and upstream pads the label with a hair space to
# push "FX1" off the left border. Open Sans fits that; a monospaced face does
# not - the digit ends up under the right border. The space goes, and the
# label is set a size smaller in overrides/style.qss.
fx/assign_buttons.xml ||| <SetVariable name="Text">&#8202;FX&#8202;</SetVariable> ||| <SetVariable name="Text">FX</SetVariable>
fx/assign_buttons.xml ||| <SetVariable name="Text">&#8202;FX</SetVariable> ||| <SetVariable name="Text">FX</SetVariable>

# --- Disabled loop range ---------------------------------------------------
# A loop that is set but not running is drawn over the waveform as a range.
# Upstream fills it with white at half opacity, which lifts the whole region
# to a light grey - and lands almost exactly on `BeatColor`, so the beat grid
# inside a disabled loop disappears into its own background.
#
# The fill becomes `warn` instead - red, because a loop that is armed but not
# running is the same kind of "off" that the EQ kill buttons mark in red. Over
# the waveform background it renders far darker than `warn` itself, around
# #3d292b: Mixxx blends a mark range considerably lighter than the stated
# opacity suggests, which is why 0.92 does not simply paint the region `warn`.
# That is also what saves the beat grid. The grid is drawn on top of the fill,
# so the darker the fill ends up, the more of the grid survives - going *up*
# in opacity with a color this dark buys both a region that is unmistakably
# marked and a grid that stays legible inside it.
waveform.xml ||| <DisabledColor>#FFFFFF</DisabledColor> ||| <DisabledColor>@warn@</DisabledColor>
waveform.xml ||| <DisabledOpacity>0.5</DisabledOpacity> ||| <DisabledOpacity>0.92</DisabledOpacity>

# The overview strip draws the same range with its own values, and a loop that
# is red in the waveform and grey in the overview is worse than either alone.
decks/overview.xml ||| <DisabledColor>#FFFFFF</DisabledColor> ||| <DisabledColor>@warn@</DisabledColor>
decks/overview.xml ||| <DisabledOpacity>0.6</DisabledOpacity> ||| <DisabledOpacity>0.92</DisabledOpacity>

# --- "Effect Units" in the skin settings panel -----------------------------
# The one label in that panel whose widget can be widened instead of having
# its type shrunk: it is the only child of its row that grows, and the two
# number toggles beside it keep their fixed width either way. 130 was enough
# for Open Sans; the monospaced label needs a little over 150.
skin_settings.xml ||| <SetVariable name="Width">130me</SetVariable> ||| <SetVariable name="Width">155me</SetVariable>
