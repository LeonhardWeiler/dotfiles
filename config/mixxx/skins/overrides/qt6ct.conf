# qt6ct configuration, generated by build-skin into $XDG_CONFIG_HOME/qt6ct/.
# `@colors_path@` is filled in with the absolute path of the generated color
# scheme; everything else is literal.
#
# This file looks system-wide and is not: qt6ct only ever runs for a process
# whose QT_QPA_PLATFORMTHEME says so, and the only place that is set is the
# Exec line of config/mixxx/org.mixxx.Mixxx.desktop. The session's own
# QT_QPA_PLATFORMTHEME stays qt5ct, which no Qt6 program reads - so every
# other Qt app is exactly as unthemed as it was before.
#
# Fusion because it is the one widget style that takes a palette without
# arguing; the skin and prefs.qss repaint almost everything on top of it
# anyway. No [Fonts] section on purpose: the fonts that matter are named in
# the style sheets, and setting an application font here would also resize
# widgets in the main window, where the skin has laid them out for its own.

[Appearance]
color_scheme_path=@colors_path@
custom_palette=true
standard_dialogs=default
style=Fusion

[Interface]
# Off, to match the flat buttons prefs.qss draws - an Ok button with a green
# tick beside the label is the one thing that gave the GTK theme away.
dialog_buttons_have_icons=0
menus_have_icons=false
underline_shortcut=1
