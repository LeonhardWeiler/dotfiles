# Scheme variable overrides for LateNight-Leo, applied by build-skin after the
# blanket recolor.
#
# The recolor rule knows a color's *hue*, not its *role*. These are the values
# where the role decides: a warning has to keep reading as a warning, the play
# marker has to be findable in a glance at a moving waveform, and cue / loop /
# intro have to stay distinguishable from each other. Monochrome applies to
# decks - they are told apart by position - not to markers that mean different
# things and sit in the same waveform.
#
# Format: `<SetVariable name> <value>`. A value that is a palette.conf color
# name is resolved from there; anything else is used verbatim.

# --- Waveform and overview backgrounds -------------------------------------
# Upstream tints these slightly (#0f0f0e, and a blue cast on decks 3/4). Use
# the one background the rest of the setup uses.
BgColorWaveform_12      bg
BgColorWaveform_34      bg
BgColorOverview_12      bg
BgColorOverview_34      bg

# --- Waveform signal -------------------------------------------------------
# Only takes effect for waveform types that honour the skin's color; the
# RGB/filtered renderers read their colors from Preferences > Waveforms
# instead, because waveform.xml leaves <SignalHighColor> and friends empty.
SignalColor_12          accent
SignalColor_34          accent

# --- Markers in the waveform -----------------------------------------------
# The one place the monochrome rule is deliberately broken. Four marker kinds
# overlap in the same strip, and hue is the only channel left to tell them
# apart - shape and position are already taken. All four are from foot's ANSI
# row, so they stay inside the colorway.
PlayPosColor            fg          # the play head: brightest thing on screen
CueColor                orange
LoopColor               green
IntroOutroColor         blue
EndOfTrackColor         warn        # a warning, not decoration
SlipBorderOutlineColor  orange      # slip mode is easy to forget you are in

# --- Grid ------------------------------------------------------------------
# Beat lines and axes sit *under* the signal; upstream's #999 competes with it.
AxesColor               border
BeatColor               border

# --- Faders ----------------------------------------------------------------
# The volume/crossfader bar is a position readout and has to be legible at a
# glance; the recolor left it at a dark #485f55.
BarColorVolume          accent
BarColorCrossfader      accent
BarColorPitch           dim
