# Qt palette for Mixxx, generated by build-skin into
# $XDG_CONFIG_HOME/qt6ct/colors/. Placeholders of the form at-name-at are
# filled from palette.conf.
#
# The style sheet in prefs.qss paints the surfaces; this covers the two things
# a style sheet cannot reach, because Qt maps only `color`,
# `background-color`, `selection-*` and `alternate-background-color` onto
# palette roles:
#
#   * Link / LinkVisited - the color of the `(?)` help links in the
#     preferences. Not blue but white: they are already marked as links by
#     their underline, and a blue that reads on a light background does not
#     read on this one.
#   * Window - Mixxx ships both an `images/preferences/light` and a
#     `.../dark` icon set for the preferences navigation and picks between
#     them by how light the palette is. On a light palette it hands out the
#     dark-on-white icons, which on this background are invisible.
#
# Format: one line per palette group, 21 colors in QPalette::ColorRole order:
# WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
# ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link,
# LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText.

[ColorScheme]
active_colors=@fg@, @surface@, #3a3a3a, #333333, #1a1a1a, #232323, @fg@, #ffffff, @fg@, @bg@, @bg@, #000000, @surface@, @fg@, #ffffff, #ffffff, #191919, @bg@, @surface@, @fg@, @dim@
disabled_colors=#666666, @surface@, #3a3a3a, #333333, #1a1a1a, #232323, #666666, #ffffff, #666666, @bg@, @bg@, #000000, @surface@, #666666, #ffffff, #ffffff, #191919, @bg@, @surface@, #666666, #666666
inactive_colors=@fg@, @surface@, #3a3a3a, #333333, #1a1a1a, #232323, @fg@, #ffffff, @fg@, @bg@, @bg@, #000000, @surface@, @fg@, #ffffff, #ffffff, #191919, @bg@, @surface@, @fg@, @dim@
