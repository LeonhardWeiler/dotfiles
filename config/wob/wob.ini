timeout = 1500
max = 100

width = 400
height = 50
border_offset = 0
border_size = 2
bar_padding = 2
anchor = top
margin = 10

background_color = 000000c0
border_color = 595959ff
bar_color = ddddddff

overflow_mode = nowrap
overflow_bar_color = ddddddff
overflow_background_color = 000000c0
overflow_border_color = ff0000ff

[style.muted]
background_color = 000000c0
border_color = 505050ff
bar_color = 707070ff

[style.critical]
background_color = 200000d0
border_color = ff5555ff
bar_color = ff5555ff

[style.record]
background_color = 001020d0
border_color = 2673a8ff
bar_color = 2673a8ff

[style.done]
background_color = 002014d0
border_color = 2a9d62ff
bar_color = 2a9d62ff
