# Read by systemd --user at session start (~/.config/environment.d/), so both
# Plasma-launched apps and terminals inherit it. Plasma already sets
# QT_QPA_PLATFORM=wayland itself; Electron needs the hint spelled out.
ELECTRON_OZONE_PLATFORM_HINT=wayland
EDITOR=nvim
BROWSER=helium
GOPATH=$HOME/.local/share/go
