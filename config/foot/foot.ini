[main]
font=JetBrainsMonoNerdFont:size=17
pad=17x15

[mouse]
hide-when-typing=yes

[key-bindings]
# Copy the last command plus its output ("Input: …" / "Output: …") to the
# clipboard. Needs the OSC-133 markers our .bashrc emits.
pipe-command-output=[copy-last-command] Control+Shift+y
# Same, but for everything on screen (all pairs since the last `clear`).
pipe-visible=[copy-visible] Control+Shift+a

[colors-dark]
background=141414
foreground=a7a7a7

regular0=2d2d2d
regular1=9d5b61
regular2=838d69
regular3=b38d6a
regular4=606d84
regular5=766577
regular6=808fa0
regular7=9c9a9a

bright0=141414
bright1=9d5b61
bright2=838b69
bright3=b38d6a
bright4=606d84
bright5=766577
bright6=808fa0
bright7=9c9a9a
