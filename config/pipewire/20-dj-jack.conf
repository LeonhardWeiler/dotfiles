# PipeWire JACK bridge -- this is the DJ-relevant file.
#
# Mixxx runs as a JACK client (SoundManagerConfig api="JACK Audio Connection
# Kit"), so these properties, not the PulseAudio path, decide its latency.
# Applies to any output device: internal HDA now, a USB interface later.

jack.properties = {
    # 256 frames @ 48 kHz = 5.3 ms. Fast enough for cue points and controller
    # work, with enough headroom to survive a browser and the EQ in the same
    # graph.
    node.latency      = 256/48000
    node.rate         = 1/48000

    # Freeze the graph quantum while a JACK client is up: without this any
    # other app starting or stopping renegotiates the buffer size and Mixxx
    # glitches mid-set.
    node.lock-quantum = true
}
