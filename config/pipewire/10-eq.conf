# Bass-leaning 10-band EQ, exposed as the sink "10-band-eq" (the default sink)
# so desktop audio runs through it.
#
# NOTE: this belongs in pipewire.conf.d/, NOT pipewire-pulse.conf.d/. It did
# load there -- pipewire-pulse parses context.modules too -- but that tied the
# EQ to the PulseAudio process instead of the daemon.
#
# Mixxx deliberately does NOT pass through here: as a JACK client it connects
# straight to the ALSA sink, so the DJ master stays flat. Do not make this the
# Mixxx output -- mixing against a +15 dB bass shelf is mixing blind.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "10 Band EQ"
            media.name = "10 Band EQ"

            filter.graph = {
                nodes = [
                    {
                        type = lv2
                        name = eq
                        plugin = "http://lsp-plug.in/plugins/lv2/graph_equalizer_x16_stereo"
                        control = {
                            xe_3 = 1
                            xe_4 = 1
                            xe_5 = 0
                            xe_6 = 1
                            xe_7 = 1
                            xe_8 = 1
                            xe_9 = 1
                            xe_10 = 0
                            xe_11 = 1
                            xe_12 = 1
                            xe_13 = 0
                            xe_14 = 1
                            xe_15 = 1

                            g_3 = 5.6234
                            g_4 = 3.9811
                            g_6 = 1.7783
                            g_7 = 1.1220
                            g_8 = 1.1220
                            g_9 = 1.4125
                            g_11 = 1.0
                            g_12 = 1.0
                            g_14 = 1.1220
                            g_15 = 1.1220
                        }
                    }
                ]
            }

            capture.props = {
                node.name = "10-band-eq"
                media.class = "Audio/Sink"
            }

            playback.props = {
                node.name = "10-band-eq-output"
            }
        }
    }
]
