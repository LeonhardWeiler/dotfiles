# PipeWire daemon settings.
#
# NOTE: this belongs in pipewire.conf.d/, NOT pipewire-pulse.conf.d/ --
# only the daemon reads default.clock.*; pipewire-pulse silently ignores it.

context.properties = {
    # Nail the graph to 48 kHz. allowed-rates is deliberately a single value:
    # with 44100 in the list PipeWire switches the card's rate whenever a
    # lone 44.1 kHz stream plays, which drops audio for a moment. Mid-set
    # that is a dropout, so 44.1 kHz material gets resampled instead.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]

    # Desktop default. Mixxx pulls the graph down to its own latency via
    # jack.conf.d/20-dj-jack.conf while it runs.
    default.clock.quantum       = 1024
    # Floor for every client, so nothing can yank the graph down to 32 and
    # make the LSP EQ underrun.
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048

    # Highest-quality resampler (default is 4) for the 44.1 -> 48 kHz
    # conversion the fixed rate above implies.
    resample.quality            = 10
}
