# Format (one mapping per line, two columns, whitespace-separated):
#
#     <source-in-repo>            <target-path>
#
# - <source-in-repo>: path relative to the repo root (e.g. config/nvim).
# - <target-path>:    where the symlink points. `~` = the user's home.
#                     Targets outside `~` (e.g. /etc/…) are created via sudo.
# - If the source ends in `/*`, the directory itself is NOT linked; instead every
#   entry inside it is linked individually into `<target>/<name>` (the target
#   directory stays real; foreign files in it are preserved). `*` does not match
#   hidden files
#
# Usage:  ./install [link|unlink|status]   (see ./install --help)
#
# ── KDE Plasma ──────────────────────────────────────────────────────────────
# This machine runs KDE Plasma (Wayland), not dwl. Everything the desktop now
# provides itself is commented out rather than deleted, so the dwl setup can be
# brought back on another machine by uncommenting. Plasma's replacements:
#   dwl -> KWin · rofi -> KRunner · wob -> Plasma OSD · foot -> Konsole
#   wbg/wallpaper -> Plasma wallpaper · qt5ct -> Plasma's own Qt styling
#   xdg-desktop-portal-wlr -> xdg-desktop-portal-kde
#   grim/slurp -> Spectacle · waylock -> Plasma lock screen

# ── Whole directories (dir symlink) ─────────────────────────────────────────
config/nvim                 ~/.config/nvim
config/mpv                  ~/.config/mpv
config/git                  ~/.config/git
config/keepassxc            ~/.config/keepassxc
config/pip                  ~/.config/pip

#config/foot                 ~/.config/foot
#config/rofi                 ~/.config/rofi
#config/wob                  ~/.config/wob
# Plasma ships its own portal config; the wlr one would break screen sharing.
#config/xdg-desktop-portal   ~/.config/xdg-desktop-portal

# Desktop-agnostic helper scripts only. The rest of config/usrbin drives the
# dwl bar/menus (app_menu, mount_menu, osd, vol_ctl, bright_ctl, bat_check,
# sanitize_menu, yt_menu, yt_save) or foot's pipe bindings (copy-visible,
# copy-last-command) and has a Plasma equivalent.
config/usrbin/sanitize              ~/.local/bin/sanitize
config/usrbin/clipboard_sanitize    ~/.local/bin/clipboard_sanitize
config/usrbin/restic-backup         ~/.local/bin/restic-backup
config/usrbin/efistub-entry         ~/.local/bin/efistub-entry
config/usrbin/update_programs_list  /usr/local/bin/update_programs_list

#config/usrbin/*             ~/.local/bin
#config/wallpaper/pictures           ~/.local/share/wallpapers
#config/wallpaper/change-wallpaper.sh  ~/.local/bin/change-wallpaper

# ── Single files (parent directory stays real) ──────────────────────────────
config/bash/.bashrc         ~/.bashrc
config/bash/.bash_profile   ~/.bash_profile
config/btop/btop.conf       ~/.config/btop/btop.conf
config/voxtype/config.toml  ~/.config/voxtype/config.toml
config/mimeapps/mimeapps.list  ~/.config/mimeapps.list
#config/bash/foot-shell-integration.bash  ~/.config/bash/foot-shell-integration.bash
# Plasma styles Qt5/Qt6 through its own settings; qt5ct would override it.
#config/qt5ct/qt5ct.conf     ~/.config/qt5ct/qt5ct.conf
# Autostart for clipboard_sanitize and the voxtype daemon - dwl started it from config.h, Plasma reads
# XDG autostart entries instead.
config/kde/environment.conf  ~/.config/environment.d/10-dotfiles.conf
config/kde/clipboard_sanitize.desktop  ~/.config/autostart/clipboard_sanitize.desktop
config/kde/voxtype.desktop  ~/.config/autostart/voxtype.desktop
# Global shortcut: kglobalaccel picks up X-KDE-Shortcuts from the entry.
config/kde/voxtype-toggle.desktop  ~/.local/share/applications/voxtype-toggle.desktop
# Idle: dim after 10 min, lock after 15, never turn the display off or suspend
# (all three power profiles). Lid close still suspends via logind.conf.
config/kde/powerdevilrc  ~/.config/powerdevilrc
config/kde/kscreenlockerrc  ~/.config/kscreenlockerrc

# PipeWire: pipewire.conf.d/ is read by the daemon, pipewire-pulse.conf.d/
# only by pipewire-pulse (which ignores default.clock.*). jack.conf.d/ drives
# the JACK bridge, i.e. Mixxx.
config/pipewire/99-custom.conf   ~/.config/pipewire/pipewire.conf.d/99-custom.conf
config/pipewire/10-eq.conf      ~/.config/pipewire/pipewire.conf.d/10-eq.conf
config/pipewire/20-dj-jack.conf ~/.config/pipewire/jack.conf.d/20-dj-jack.conf
# Mixxx: only the hand-written config. The parent ~/.mixxx/ stays real - Mixxx
# keeps its library DB, waveform caches and logs in there.
config/mixxx/Custom.kbd.cfg     ~/.mixxx/Custom.kbd.cfg
config/mixxx/soundconfig.xml    ~/.mixxx/soundconfig.xml
# Overrides the packaged entry by desktop-id, to pass the dialog stylesheet
# that config/mixxx/skins/build-skin writes to ~/.mixxx/prefs.qss.
config/mixxx/org.mixxx.Mixxx.desktop  ~/.local/share/applications/org.mixxx.Mixxx.desktop
config/claude/skills/*      ~/.claude/skills
config/claude/settings.json ~/.claude/settings.json
# Native messaging host for the yt-save add-on - Firefox/Zen only, no browser
# on this machine uses it.
#config/zen-yt/at.leo.yt_save.json  ~/.mozilla/native-messaging-hosts/at.leo.yt_save.json

# ── System targets in /etc (per file, via sudo) ─────────────────────────────
config/pacman/dotfiles-programs-list.hook   /etc/pacman.d/hooks/dotfiles-programs-list.hook
config/pacman/pacman.conf                   /etc/pacman.conf
config/locale/locale.conf                   /etc/locale.conf
config/locale/locale.gen                    /etc/locale.gen
# NOT linked on this machine: the initramfs is hardware-specific and this host
# has a hybrid NVIDIA/AMD GPU on ext4, while the repo's config was written for
# the old single-AMD/btrfs laptop. Linking it risks an unbootable system.
#config/mkinitcpio/mkinitcpio.conf           /etc/mkinitcpio.conf
# Lid handling belongs to Plasma's powerdevil here.
#config/logind/logind.conf                   /etc/systemd/logind.conf
